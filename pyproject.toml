[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-analytics-factory"
version = "0.1.0"
description = "Clean-room TikTok creative analytics and generation factory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
ingestion = [
    "yt-dlp>=2024.4.9",
    "requests>=2.31",
    "pyktok>=0.0.31; python_version < '3.13'",
]
dev = [
    "pytest>=8",
]
qa = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional live-network tests (deselected by default)"]
addopts = "-m 'not integration'"
